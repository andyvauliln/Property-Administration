# Sandbox test cases for `manage.py ai_agent_sandbox_test` (simple_telegram_alerts.md, part 11).
#
# ONE STORY: the stay of Vera Lopez in the sandbox apartment "Sandbox Test" (105 Wilson Ave 2B), 6 Oct - 19 Dec 2026.
# The `story:` block is what the runner writes into the CRM at the start - REAL rows on that apartment: the knowledge page,
# the booking, the payments, the parking spot, the contract. The cases are the CHAPTERS of the story, in time order (the order
# of this file): nothing is wiped between them, every chapter sees what the earlier ones did (messages, tasks, reminders,
# knowledge the team saved, parking booked by a press). After every chapter the sandbox rows are saved, so "rerun" and
# "run <chapter>" start from the state that chapter started from. All dates are moved forward by whole weeks when the story
# is run (the week day stays), so a reminder is never already due for the live worker.
#
# The EXAMPLE TEXT of a case is in the document: the runner reads the section `### <doc>.` of simple_telegram_alerts.md
# (doc = the case id unless `doc:` says otherwise) and a Claude judge compares the alert with it by meaning. This file
# holds what code can check exactly. Rule: change an example in the document -> change its case here in the same commit.
#
# Keys of a chapter
#   title (shown as "What we test" in the notes), doc, checks (one line: the branch of the logic, for the judge)
#   time              "YYYY-MM-DD HH:MM" ET - the moment of the trigger; never before the chapter above
#   mode              live | test          clickup: on | off (the AI's own ClickUp writing) - story.defaults when missing
#   setup             sms_fail, clickup_fail, call_answered (the switches of this chapter)
#   crm               changes of the real rows before the trigger: payments [{type, date, status, amount} | {add: {...}}],
#                     booking {start, end, status}, parking [{spot, booked}], knowledge (the whole page)
#   prelude           steps run before the trigger (alerts posted, not checked)
#   trigger           one step
#   step              [ {from: tenant|team, name, text, at} ... ]  one burst = one agent run
#                     {reminder: next} (the earliest pending reminder) | {report: daily} | {reply: "text", by, on: first|last}
#                     {notification: <kind>, text: "template text"}   an automatic notification of the 08:00 job (part 8a)
#                     {press: "label", by, on: first|last} | {wait: "2h"}
#   expect            alert, also, urgency, sound, parts, contains, not_contains, conversation{before, now_contains},
#                     answer, answer_contains, answer_not_contains, tasks, task_details[{who, priority, due_in}],
#                     updates, reminders[{who, kind, in | at, n}], reminders_closed, knowledge[{scope, contains}],
#                     rules[{kind, contains}], crm[{change, spot}], crm_done[{change, spot}], legal, buttons,
#                     sent_to_tenant, sent_contains, call, earlier{outdated, contains, buttons}, reply_contains, popup_contains
#   presses           [{button, expect, optional}] presses the runner does itself in --auto mode, after the check (the team's
#                     presses are part of the story); "A | B" = the first of the alternatives that exists; optional = skip when absent
#   not_built         the chapter is skipped with this note (a feature that is not built yet keeps its place in the story)
# Durations: "30m", "2h", "72h". Result of a press on an existing alert is checked with `earlier` (that alert after
# the press); a new bot message after a reply / press with `reply_contains` + `buttons`.

story:
  apartment: Sandbox Test
  defaults:
    mode: live
    clickup: 'off'
  tenant:
    name: Vera Lopez
  booking:
    start: '2026-10-06'
    end: '2026-12-05'
    status: Confirmed
    tenants: 2
  payments:
  - type: Hold Deposit
    amount: 2150
    date: '2026-10-01'
    status: Completed
    notes: deposit
  - type: Rent
    amount: 2150
    date: '2026-10-05'
    status: Pending
    notes: October
  - type: Rent
    amount: 2150
    date: '2026-11-05'
    status: Pending
    notes: November
  parking:
  - spot: '14'
    notes: garage, next to the mailboxes
    booked: false
  knowledge: 'WiFi network: MyHome-5G, password: B123H4689
  
    Door code: 4521# (the code was changed on Monday 5 Oct 2026)
  
    Gate code: 8832
  
    Lockbox: on the left side of the door, code 7788 - for late arrivals and guests, put the key back after use
  
    Check-in is at 4 PM, check-out at 10 AM
  
    Trash room: 1st floor next to the mail boxes, pickup Tuesday and Friday
  
    Washer and dryer are in the unit, in the hallway closet
  
    Water shut-off valve: under the kitchen sink
  
    Emergency maintenance (water leak, no power, no heat): the team is called at any hour
  
    No smoking inside the unit; quiet hours 10 PM - 8 AM'
  contract:
    name: Residential lease agreement
    signed: true
    terms:
      Tenant: Vera Lopez
      Unit: 105 Wilson Ave, apt 2B
      Term: 6 Oct 2026 - 5 Dec 2026
      Monthly rent: $2,150, due on the 5th of each month
      Late fee: $50 when the rent is more than 5 days late
      Security deposit: $2,150, returned within 15 days after move-out minus damage and cleaning costs (section 9)
      Cleaning: the unit is returned clean; otherwise a cleaning fee of up to $300 is deducted from the deposit (section 9)
      Pets: no pets
      Extension: only by written agreement at least 14 days before the end date (section 4)
      Check-out: 10 AM on the end date
    text: 'Section 4 - Term and extension. The lease ends on the end date. An extension is possible only by written agreement
      at least 14 days before the end date, at the rent then in force.
  
      Section 5 - Rent. Rent of $2,150 is due on the 5th of each month. Rent paid more than 5 days late carries a late fee
      of $50.
  
      Section 9 - Deposit. The deposit of $2,150 is returned within 15 days after move-out, minus the cost of damage beyond
      normal wear and minus a cleaning fee of up to $300 when the unit is not returned clean. The landlord gives an itemized
      list.
  
      Section 12 - Guests. Guests may stay up to 7 nights per month; the tenant is responsible for them.'

