  time: 2026-10-07 19:05
  trigger:
  - from: tenant
    name: Vera Lopez
    text: 'Hi, so a few things: first the AC makes a noise at night. It started about a week ago, I think on Monday or Tuesday,
      and at first I thought it was the neighbors or something outside, but it is definitely coming from the unit in the
      hallway ceiling. It is a kind of rattling sound, like something loose is vibrating, and it starts about ten or fifteen
      minutes after the AC turns on and goes on until it switches off again. During the day I don''t really notice it because
      of the street and the TV, but at night when everything is quiet it wakes me up two or three times, and my husband
      has started sleeping with earplugs. We tried setting the temperature a bit higher so that it runs less often, and
      that helps a little, but then the bedroom gets too warm, so it is not really a solution. I also changed the filter
      last weekend because I thought maybe that was the reason, the old one was quite dusty, but the noise is exactly the
      same as before. I recorded a short video with the sound last night and I can send it to you if that helps the technician
      to understand what it is before he comes. The unit also drips a little water into the tray under it when it has been
      running for a long time, I am not sure if that is normal or if it has something to do with the noise, but I wanted
      to mention it. Second thing, the balcony door. The sliding door to the balcony has become very hard to open and close,
      you really have to push it with both hands, and since Sunday it also makes a scraping noise when it moves, so every
      time we go out to the balcony it sounds like metal on metal. The lock still closes fine, so this is not about safety
      at all, it is only annoying and I am afraid that one day it will get stuck completely, and when it rains and the wind
      comes from the east some water gets in at the bottom of the door and onto the floor. I put a towel there for now.
      The handle on the inside is also a bit loose, two of the screws turn without getting tight, so maybe the whole handle
      part has to be replaced and not only adjusted, but you will know better than me. I looked at the track and there is
      some sand and small stones in it, I cleaned what I could with the vacuum cleaner, but it did not change much, I think
      one of the little wheels under the door is broken or came off its rail. Could somebody come and have a look at both
      things, the AC and the door, ideally at the same visit so that I only have to take time off work once? Mornings before
      9:30 or any time after 5 pm are best for us this week, and on Friday I work from home, so on Friday any time is fine.
      Please just let me know the day before so that I can make sure someone is at home, or tell me if it is ok for the
      technician to come in when we are not there, in that case I would put the cat in the bedroom. And the third thing
      is a question about parking. My sister is coming to visit us from the 16th to the 19th of October and she will come
      by car. Is there a guest parking spot in the garage that she can use for these three nights, or does she have to park
      on the street? If there is a guest spot, do I need to register her car somewhere or get a pass from you, and does
      it cost anything? If she has to park on the street, do you know if she needs a permit for our street at night, I saw
      some signs on the corner but I did not really understand them, and I don''t want her to get a ticket or be towed on
      her first visit. If it is easier you can also just tell me who I should ask about this in the building, maybe the
      front desk knows, but they told me last time to ask the management company, so here I am. Her car is a normal small
      one, a grey Toyota, in case the size matters for the spot. Sorry for the long message, I wanted to put everything
      in one place so that nothing gets lost. Thank you very much for your help, and thanks again to Janna for being flexible
      with the rent date this month, we really appreciate it. Have a good evening! Vera'
